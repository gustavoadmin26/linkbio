<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06152f">
  <meta name="description" content="Gustavo Goulart — Arquitetura de Crescimento™. Estratégia, mentoria, método e palestras.">
  <meta property="og:title" content="Gustavo Goulart | Arquitetura de Crescimento™">
  <meta property="og:description" content="Estratégia, mentoria, método e palestras para empresas que querem crescer.">
  <title>Gustavo Goulart | Arquitetura de Crescimento™</title>
  <style>
    :root{--bg:#06152f;--blue:#4aa7ff;--text:#f4f7fb;--muted:#a9bad3}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% 10%,rgba(30,92,255,.24),transparent 28%),radial-gradient(circle at 12% 18%,rgba(74,167,255,.12),transparent 28%),linear-gradient(145deg,#04112a,#071b3a 52%,#041127);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;z-index:-1;left:-18vw;right:-18vw;height:46vh;border-top:1px solid rgba(65,144,255,.14);border-radius:50%;pointer-events:none}
    body:before{bottom:4vh;transform:rotate(-7deg);box-shadow:0 -55px 0 rgba(65,144,255,.04),0 -110px 0 rgba(65,144,255,.03)}
    body:after{top:25vh;transform:rotate(8deg);opacity:.45}
    a{color:inherit;text-decoration:none}
    .shell{width:min(760px,calc(100% - 28px));margin:0 auto;padding:42px 0 max(42px,env(safe-area-inset-bottom))}
    .profile{text-align:center;padding:18px 16px 30px}
    .avatar-wrap{width:112px;height:112px;margin:0 auto 18px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#fff,#4aa7ff 55%,#1e5cff);box-shadow:0 18px 55px rgba(0,0,0,.35),0 0 0 7px rgba(74,167,255,.06)}
    .avatar{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;object-position:center 35%;border:4px solid #071b3a}
    .profile h1{margin:0;font-size:clamp(28px,7vw,38px);line-height:1.05;letter-spacing:-.035em}
    .handle{display:inline-block;margin-top:9px;color:#b8c8dc;font-size:15px}
    .handle:hover{color:#fff}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;margin-top:17px;color:#79baff;font-weight:800;font-size:11px;letter-spacing:.16em}
    .eyebrow:before,.eyebrow:after{content:"";width:22px;height:1px;background:#4aa7ff;opacity:.75}
    .bio{max-width:560px;margin:14px auto 0;color:#a9bad3;font-size:14px;line-height:1.55}
    .cards{display:grid;gap:16px}
    .card{position:relative;display:block;border-radius:22px;overflow:hidden;border:1px solid rgba(120,170,230,.18);background:#071b3a;box-shadow:0 20px 55px rgba(0,0,0,.27);isolation:isolate;transform:translateZ(0);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
    .card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
    .card img{display:block;width:100%;height:auto;aspect-ratio:1000/556;object-fit:cover}
    .card:hover{transform:translateY(-4px);border-color:rgba(74,167,255,.52);box-shadow:0 28px 70px rgba(0,0,0,.34)}
    .card:focus-visible{outline:3px solid #76b8ff;outline-offset:4px}
    .footer{text-align:center;padding:30px 12px 4px;color:#7086a5;font-size:12px;line-height:1.6}
    .footer strong{display:block;color:#b8c8dc;font-size:13px;margin-bottom:3px}
    .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:99;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:rgba(4,17,38,.95);color:#fff;border:1px solid rgba(74,167,255,.3);border-radius:999px;padding:12px 18px;font-size:13px;box-shadow:0 16px 45px rgba(0,0,0,.35);backdrop-filter:blur(16px);transition:.25s}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:560px){.shell{width:min(100% - 18px,760px);padding-top:22px}.profile{padding:12px 12px 22px}.avatar-wrap{width:96px;height:96px;margin-bottom:15px}.cards{gap:11px}.card{border-radius:17px}.bio{font-size:13px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="profile">
      <div class="avatar-wrap"><img class="avatar" data-image="AVATAR" alt="Gustavo Goulart"></div>
      <h1>Gustavo Goulart</h1>
      <a class="handle" href="https://www.instagram.com/gustavogoulart.ads/" target="_blank" rel="noreferrer">@gustavogoulart.ads</a>
      <div class="eyebrow">ARQUITETURA DE CRESCIMENTO™</div>
      <p class="bio">Estratégia para conectar marketing, vendas e expansão — e transformar crescimento em um processo estruturado.</p>
    </header>

    <section class="cards" aria-label="Links principais">
      <a class="card" href="#" data-key="APPLY_URL" aria-label="Contrate a Arquitetura de Crescimento para sua empresa"><img src="/media/card1.webp" alt="Contrate a Arquitetura de Crescimento para sua empresa"></a>
      <a class="card" href="#" data-key="MENTORIA_URL" aria-label="Aprenda comigo — conhecer a mentoria"><img src="/media/card2.webp" alt="Aprenda comigo — Mentoria prática para empresários e agências"></a>
      <a class="card" href="#" data-key="METODO_URL" aria-label="Conheça a Arquitetura de Crescimento"><img src="/media/card3.webp" alt="O que é a Arquitetura de Crescimento"></a>
      <a class="card" href="#" data-key="PALESTRAS_URL" aria-label="Palestras e workshops — contratar"><img src="/media/card4.webp" alt="Palestras e workshops"></a>
    </section>

    <footer class="footer"><strong>Gustavo Goulart</strong>Arquitetura de Crescimento™ · Marketing, vendas e expansão</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite">Este link está sendo configurado.</div>

  <script>window.LINKBIO_MEDIA={};</script>
  <script src="/media/avatar.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
